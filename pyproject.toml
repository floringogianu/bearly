[project]
name = "bearly"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florin Gogianu", email = "florin.gogianu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    "scipy>=1.16.3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
plots = [
    "marimo>=0.18.4",
    "plotnine>=0.15.2",
    "pyarrow>=22.0.0",
    "rich>=14.2.0",
]

[dependency-groups]
dev = [
    "bearly[plots]",
    "basedpyright>=1.37.0",
    "ruff>=0.14.10",
    "marimo[lsp]>=0.18.4",
    "nodejs-bin[cmd]>=18.4.0a4",
    "ipython>=9.9.0",
    "commitizen>=4.20.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "semver2"
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true
bump_message = "bump: version $current_version → $new_version [skip ci]"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: end-to-end tests hitting the bundled Atari data (~1 min)",
]
